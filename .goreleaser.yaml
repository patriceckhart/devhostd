# Cross-platform release archives are generated from tags created by the
# release workflow. Local snapshots can be built with:
# goreleaser release --snapshot --clean
version: 2

project_name: devhostd

before:
  hooks:
    - go mod tidy

builds:
  - id: devhostd
    main: ./cmd/devhostd
    binary: devhostd
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: devhostd
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

release:
  github:
    owner: patriceckhart
    name: devhostd
  draft: false
  prerelease: auto
  header: |
    ## devhostd {{ .Tag }}

    Install the latest release on macOS or Linux:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/patriceckhart/devhostd/main/install.sh | bash
    ```

    Or download the archive for your platform, verify it against
    `checksums.txt`, and place the `devhostd` binary on your `PATH`.
